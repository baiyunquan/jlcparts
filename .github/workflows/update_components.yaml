name: "Update component database"
on:
  push:
    branches:
      - master
      - feat/*
  pull_request:
  workflow_dispatch:
    inputs:
      fetch_limit:
        description: "Maximum number of component extras/images to fetch"
        required: true
        default: "40000"
      max_seconds:
        description: "Maximum runtime in seconds (e.g. 7200 for 2 hours)"
        required: true
        default: "7200"
      concurrency:
        description: "Number of concurrent request workers"
        required: true
        default: "12"
      stock_only:
        description: "Prioritize in-stock components"
        type: boolean
        default: true
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 11 * * *'
    - cron: '0 19 * * *'
permissions:
  contents: write
concurrency:
  group: update-components-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build_and_update:
    name: "Build component database and frontend"
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pip nodejs npm wget zip unzip p7zip-full
          sudo pip3 install requests click lxml --break-system-packages || sudo pip3 install requests click lxml
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build frontend
        run: |
          cd web
          if [ "$GITHUB_REPOSITORY" = 'yaqwsx/jlcparts-dev' ]; then
            export BASEURL=https://jlcparts-dev.honzamrazek.cz
          elif [ -n "$GITHUB_REPOSITORY_OWNER" ]; then
            export BASEURL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          else
            export BASEURL=https://yaqwsx.github.io/jlcparts
          fi
          npm install --silent
          NODE_ENV=production PUBLIC_URL=${BASEURL} npm run build
          touch build/.nojekyll
      - name: Build database files
        env:
          WORKFLOW_EVENT_NAME: ${{ github.event_name }}
          INPUT_FETCH_LIMIT: ${{ inputs.fetch_limit }}
          INPUT_MAX_SECONDS: ${{ inputs.max_seconds }}
          INPUT_CONCURRENCY: ${{ inputs.concurrency }}
          INPUT_STOCK_ONLY: ${{ inputs.stock_only }}
        run: |
          set -x
          sudo pip3 install -e . --break-system-packages || sudo pip3 install -e .

          # Determine data source URL: try own fork pages first, fallback to upstream yaqwsx
          FORK_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data"
          UPSTREAM_URL="https://yaqwsx.github.io/jlcparts/data"

          if wget --spider -q "${FORK_URL}/cache.zip"; then
            export DATAURL="${FORK_URL}"
          else
            export DATAURL="${UPSTREAM_URL}"
          fi
          echo "Using DATAURL: ${DATAURL}"

          if wget -q ${DATAURL}/cache.zip; then
            downloaded_parts=()
            part=1
            while true; do
              if [ "$part" -le 99 ]; then
                suffix=$(printf "%02d" "$part")
              else
                suffix="$part"
              fi
              name="cache.z${suffix}"
              if wget -q "${DATAURL}/${name}"; then
                downloaded_parts+=("${name}")
                part=$((part + 1))
                continue
              fi
              rm -f "${name}"
              break
            done

            7z x cache.zip
            rm -f cache.zip
            if [ ${#downloaded_parts[@]} -gt 0 ]; then
              rm -f "${downloaded_parts[@]}"
            fi
          else
            rm -f cache.zip
            if [ "$WORKFLOW_EVENT_NAME" != "schedule" ] && [ "$WORKFLOW_EVENT_NAME" != "workflow_dispatch" ]; then
              echo "No published cache found; only scheduled or manual runs may fetch a fresh database"
              exit 1
            fi
            echo "No published cache found, bootstrapping a fresh database"
          fi

          if [ -f cache.sqlite3 ]; then
            jlcparts migratecache cache.sqlite3
          fi

          if [ "$WORKFLOW_EVENT_NAME" = "schedule" ] || [ "$WORKFLOW_EVENT_NAME" = "workflow_dispatch" ]; then
            wget -q ${DATAURL}/parts.checkpoint.json || rm -f parts.checkpoint.json

            fetch_seconds=${INPUT_MAX_SECONDS:-${JLCPARTS_FETCH_SECONDS:-7200}}
            lcsc_limit=${INPUT_FETCH_LIMIT:-${JLCPARTS_LCSC_LIMIT:-40000}}
            concurrency=${INPUT_CONCURRENCY:-12}
            lcsc_age=${JLCPARTS_LCSC_AGE:-10000}

            stock_flag="--stock-only"
            if [ "$INPUT_STOCK_ONLY" = "false" ]; then
              stock_flag=""
            fi

            jlcparts fetchdb --verbose \
                             --checkpoint parts.checkpoint.json \
                             --max-seconds "$fetch_seconds" \
                             --age "$lcsc_age" \
                             --limit "$lcsc_limit" \
                             --concurrency "$concurrency" \
                             $stock_flag \
                             cache.sqlite3
            jlcparts updatepreferred cache.sqlite3
          else
            rm -f parts.checkpoint.json
          fi

          jlcparts buildtables --jobs 0 \
                               --ignoreoldstock 120 \
                               cache.sqlite3 web/build/data

          if [ -f parts.checkpoint.json ]; then
            cp parts.checkpoint.json web/build/data/parts.checkpoint.json
          fi

          rm -f web/build/data/cache.z*
          zip -s 50m web/build/data/cache.zip cache.sqlite3
      - name: Upload raw database artifact
        uses: actions/upload-artifact@v4
        with:
          name: jlcparts_cache_database
          path: cache.sqlite3
          retention-days: 30
      - name: Tar web artifact
        run: tar -czf web_build.tar.gz web/build/
      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web_build
          path: web_build.tar.gz
          retention-days: 14
  deploy:
    name: "Deploy"
    runs-on: ubuntu-24.04
    needs: build_and_update
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feat/lcsc-open-api-crawler'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "Download web"
        uses: actions/download-artifact@v4
        with:
          name: web_build
      - name: Untar artifact
        run: tar -xzf web_build.tar.gz
      - name: Deploy to GH Pages
        uses: JamesIves/github-pages-deploy-action@v4.6.0
        with:
          branch: gh-pages
          folder: web/build
          single-commit: true
